# ═══════════════════════════════════════════════════════════════
#  Construit l'APK Android. Tourne sur Linux → minutes GitHub
#  standard (pas le multiplicateur ×10 des runners macOS).
#  Actions → Android → Run workflow → télécharge l'artefact.
# ═══════════════════════════════════════════════════════════════
name: Android

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Type de build"
        type: choice
        options: [debug, release]
        default: debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 exige Node >= 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # AGP 8.13 + sourceCompatibility 21 exigent le JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: SDK Android 36 (compileSdk)
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Dépendances + build web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assembler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "${{ inputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Vérifier la cohérence des versions
        if: failure()
        working-directory: android
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.variant }}
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
