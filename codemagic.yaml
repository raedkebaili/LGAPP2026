# ═══════════════════════════════════════════════════════════════
#  Codemagic — 500 minutes macOS M2 gratuites par mois sur un
#  compte personnel. Alternative à GitHub Actions, interface plus
#  simple pour la signature iOS. Aucun Mac requis.
#  → codemagic.io  ·  connecte le dépôt  ·  lance « ios-release ».
# ═══════════════════════════════════════════════════════════════
workflows:
  ios-release:
    name: iOS — LOUP GAROU BEL TOUNSI
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store      # ou: ad_hoc / development
        bundle_identifier: tn.houma.loupgaroubeltounsi
      groups:
        - appstore_credentials             # ASC_KEY_ID · ASC_ISSUER_ID · ASC_PRIVATE_KEY
    scripts:
      - name: Dépendances
        script: npm ci
      - name: Build web
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Pods
        script: |
          cd ios/App
          pod install || true
      - name: Profils de signature
        script: xcode-project use-profiles
      - name: Archive
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-unsigned:
    name: iOS — IPA non signée (sans compte Apple)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
    scripts:
      - script: npm ci
      - script: npm run build
      - script: npx cap sync ios
      - name: Archive sans signature
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive
          mkdir -p $CM_BUILD_DIR/Payload
          cp -R $CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app $CM_BUILD_DIR/Payload/
          cd $CM_BUILD_DIR && zip -qry LoupGarouBelTounsi-unsigned.ipa Payload
    artifacts:
      - LoupGarouBelTounsi-unsigned.ipa
